<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload | Baselarte</title>
    <meta name="description" content="Upload, organize and manage photos and videos on Baselarte.">
    <meta name="author" content="Baselarte">
    <meta name="robots" content="noindex, nofollow">

    <link rel="canonical" href="https://baselarte.com/upload">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Upload | Baselarte">
    <meta property="og:description" content="Upload, organize and manage photos and videos on Baselarte.">
    <meta property="og:url" content="https://baselarte.com/upload">
    <meta property="og:locale" content="en_US">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Upload | Baselarte">
    <meta name="twitter:description" content="Upload, organize and manage photos and videos on Baselarte.">

    <meta name="theme-color" content="#111111">
    <meta name="color-scheme" content="light dark">
    
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='black'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="./upload.css">
    <script>
        if (localStorage.getItem("theme") === "dark") {
            document.documentElement.classList.add("dark");
        }
    </script>
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Baselarte",
        "url": "https://baselarte.com/upload",
        "description": "Software engineering and infrastructure learning project."
    }
    </script>
</head>

<body>
    <header class="topbar">
        <nav class="actions">
            <button id="theme-toggle" class="button" type="button">Theme</button>
            <button id="logout-button" class="button" type="button">Logout</button>
        </nav>
    </header>

    <main class="upload-page">
        <section class="upload-header">
            <h1>Upload</h1>
            <p>Manage your photos, videos and folders.</p>
        </section>

        <nav id="breadcrumb" class="breadcrumb">
            Home
        </nav>

        <section class="toolbar">
            <button id="upload-button" class="button" type="button">Upload files</button>
            <button id="folder-button" class="button" type="button">Create folder</button>
            <button id="back-button" class="button secondary" type="button" hidden>Back</button>
            <input id="file-input" type="file" accept="image/*,video/*" multiple hidden>
        </section>

        <section id="gallery" class="gallery">
        </section>
    </main>

    <dialog id="folder-dialog">
        <form>
            <h2>Folder</h2>
            <label for="folder-name">Folder name</label>
            <input id="folder-name" type="text" maxlength="100">
            <div class="dialog-actions">
                <button id="cancel-folder" class="button secondary" type="button">Cancel</button>
                <button id="save-folder" class="button" type="button">Save</button>
            </div>
        </form>
    </dialog>

    <dialog id="media-dialog">
        <form>
            <h2>Edit media</h2>
            <label for="media-description">Description</label>
            <textarea id="media-description" maxlength="500"></textarea>
            <label for="media-hashtags">Hashtags</label>
            <input id="media-hashtags" type="text" maxlength="200" placeholder="#example #photo">
            <div class="dialog-actions">
                <button id="cancel-media" class="button secondary" type="button">Cancel</button>
                <button id="save-media" class="button" type="button">Save</button>
            </div>
        </form>
    </dialog>

    <dialog id="confirm-dialog">
        <form>
            <h2>Confirm deletion</h2>
            <p id="confirm-message"></p>
            <div class="dialog-actions">
                <button id="cancel-delete" class="button secondary" type="button">Cancel</button>
                <button id="confirm-delete" class="button" type="button">Delete</button>
            </div>
        </form>
    </dialog>

    <script src="./upload.js"></script>
</body>

</html>
