<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication | Baselarte</title>
    <meta name="description" content="Authentication page for Baselarte.">
    <meta name="author" content="Baselarte">

    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://baselarte.com/auth">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Authentication | Baselarte">
    <meta property="og:description" content="Authentication page for Baselarte.">
    <meta property="og:url" content="https://baselarte.com/auth">
    <meta property="og:locale" content="en_US">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Authentication | Baselarte">
    <meta name="twitter:description" content="Authentication page for Baselarte.">

    <meta name="theme-color" content="#111111">
    <meta name="color-scheme" content="light dark">

    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='black'/%3E%3C/svg%3E">

    <link rel="stylesheet" href="./login.css">

    <script>
        if (localStorage.getItem("theme") === "dark") {
            document.documentElement.classList.add("dark");
        }
    </script>
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Baselarte",
        "url": "https://baselarte.com/login",
        "description": "Software engineering and infrastructure learning project."
    }
    </script>
</head>

<body>

    <header class="topbar">
        <nav class="actions">
            <a href="../index.html" class="action-button">Home</a>
            <button id="theme-toggle" class="action-button" type="button">Theme</button>
        </nav>
    </header>

    <main class="auth-page">
        <section class="auth-card">
            <h1>baselarte</h1>
            <p class="subtitle">Authentication</p>

            <form id="login-form" novalidate>
                <h2>Login</h2>

                <label for="login-identifier">Email or username</label>
                <input id="login-identifier" name="identifier" type="text" autocomplete="username" maxlength="100"
                    required>
                <small id="login-identifier-error" class="error"></small>

                <label for="login-password">Password</label>
                <input id="login-password" name="password" type="password" autocomplete="current-password" minlength="4"
                    required>
                <small id="login-password-error" class="error"></small>

                <button class="submit-button" type="submit">Login</button>

                <p class="switch-form">
                    Don't have an account?
                    <button id="show-register" type="button" class="link-button">Register</button>
                </p>
            </form>

            <form id="register-form" class="hidden" novalidate>
                <h2>Register</h2>

                <label for="register-identifier">Email or username</label>
                <input id="register-identifier" type="text" maxlength="100" required>
                <small id="register-identifier-error" class="error"></small>

                <label for="register-name">Name</label>
                <input id="register-name" type="text" maxlength="100" required>
                <small id="register-name-error" class="error"></small>

                <label for="register-password">Password</label>
                <input id="register-password" type="password" minlength="4" required>
                <small id="register-password-error" class="error"></small>

                <button class="submit-button" type="submit">Register</button>

                <p class="switch-form">
                    Already have an account?
                    <button id="show-login" type="button" class="link-button">Login</button>
                </p>
            </form>
        </section>
    </main>

    <script src="./login.js"></script>

</body>

</html>
